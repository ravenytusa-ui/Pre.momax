<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit - PremoMax</title>
    <!-- Supabase CDN Script -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #0f172a;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .deposit-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 350px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        h2 { text-align: center; color: #0f172a; margin-bottom: 20px; }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: bold;
            color: #64748b;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background-color: #10b981;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:hover { background-color: #059669; }
    </style>
</head>
<body>

    <div class="deposit-card">
        <h2>Enter Transaction ID</h2>
        
        <div class="input-group">
            <label>TRANSACTION ID / HASH</label>
            <input type="text" placeholder="Enter your transaction ID" id="txnId">
        </div>

        <button class="btn" onclick="submitDeposit()">Submit Deposit &rarr;</button>
    </div>

    <script>
        // Apni Supabase URL aur Publishable Key yahan dalein
        const SUPABASE_URL = 'https://itbcliczvrezshhkdnj.supabase.co';
        const SUPABASE_ANON_KEY = 'YAHAN_APNI_PUBLISHABLE_KEY_DALEN';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function submitDeposit() {
            const txnId = document.getElementById('txnId').value.trim();
            const userEmail = localStorage.getItem('userEmail');

            if (!txnId) {
                alert('Please enter your transaction ID!');
                return;
            }

            if (!userEmail) {
                alert('User session not found. Please sign up again.');
                window.location.href = 'signup.html';
                return;
            }

            // Database mein user ki email ke zariye transaction ID update karna
            const { error } = await supabaseClient
                .from('users')
                .update({ transaction_id: txnId, status: 'pending' })
                .eq('email', userEmail);

            if (error) {
                alert('Error: ' + error.message);
            } else {
                alert('Deposit submitted successfully! Waiting for admin approval.');
                window.location.href = 'dashboard.html';
            }
        }
    </script>
</body>
</html>
