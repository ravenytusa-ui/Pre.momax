<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - PremoMax</title>
    <style>
        body {
            background-color: #f8f9fa;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh; /* Agar screen choti ho to scroll karne ke liye thora margin */
            margin: 0;
            padding: 20px 0;
        }
        .login-box {
            background-color: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            text-align: center;
            width: 350px;
        }
        h2 {
            color: #1e293b;
            margin-bottom: 5px;
        }
        p {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .input-group {
            text-align: left;
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: bold;
            color: #475569;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            background-color: #f8fafc;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background-color: #d97706; /* Orange button */
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #b45309;
        }
        .footer-text {
            margin-top: 20px;
            font-size: 13px;
            color: #64748b;
        }
        .footer-text a {
            color: #0f172a;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>Create an Account</h2>
        <p>Join us today</p>

        <div class="input-group">
            <label>FULL NAME</label>
            <input type="text" placeholder="Enter your full name" id="name">
        </div>

        <div class="input-group">
            <label>EMAIL</label>
            <input type="email" placeholder="Enter your email" id="email">
        </div>

        <div class="input-group">
            <label>PHONE NUMBER</label>
            <input type="tel" placeholder="Enter your phone number" id="phone">
        </div>

        <div class="input-group">
            <label>PASSWORD</label>
            <input type="password" placeholder="........" id="password">
        </div>

        <div class="input-group">
            <label>RE-TYPE PASSWORD</label>
            <input type="password" placeholder="........" id="repassword">
        </div>

        <button class="btn" onclick="testSignup()">Sign Up &rarr;</button>

        <div class="footer-text">
            Already have an account? <a href="login.html">Sign in</a>
        </div>
    </div>

  <script>
    function testSignup() {
        // User ka likha hua naam uthana
        var userName = document.getElementById("name").value;
        
        // Agar naam khali nahi hai to save kar lo
        if (userName.trim() !== "") {
            localStorage.setItem("savedUserName", userName);
        } else {
            localStorage.setItem("savedUserName", "User"); // Agar naam na likhe to default "User" rahe
        }

        // Ye line user ko direct deposit page par le jayegi
        window.location.href = "deposit.html";
    }
</script>
</body>
</html>
