<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - PremoMax</title>
    <!-- Supabase CDN Script -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background-color: #0f172a;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .signup-card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            width: 350px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        h2 { text-align: center; color: #0f172a; margin-bottom: 20px; }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            font-size: 11px;
            font-weight: bold;
            color: #64748b;
            margin-bottom: 5px;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background-color: #f59e0b;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn:hover { background-color: #d97706; }
        .footer-text {
            text-align: center;
            margin-top: 15px;
            font-size: 13px;
            color: #64748b;
        }
        .footer-text a { color: #f59e0b; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="signup-card">
        <h2>Create Account</h2>
        
        <div class="input-group">
            <label>FULL NAME</label>
            <input type="text" placeholder="Enter your full name" id="name">
        </div>

        <div class="input-group">
            <label>EMAIL</label>
            <input type="email" placeholder="Enter your email" id="email">
        </div>

        <div class="input-group">
            <label>PHONE NUMBER</label>
            <input type="tel" placeholder="Enter your phone number" id="phone">
        </div>

        <div class="input-group">
            <label>PASSWORD</label>
            <input type="password" placeholder="********" id="password">
        </div>

        <button class="btn" onclick="handleSignup()">Sign Up &rarr;</button>

        <div class="footer-text">
            Already have an account? <a href="login.html">Sign in</a>
        </div>
    </div>

    <script>
        // Yahan apni Supabase Project ki URL aur Anon Key lagani hai
        const SUPABASE_URL = 'https://itbcliczvrezshhkhdnj.supabase.co/rest/v1/';
        const SUPABASE_ANON_KEY = 'sb_publishable_SP2eboFIv_2oUqxkRsukhQ_C-Aft2Hq';
        
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function handleSignup() {
            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!name || !email || !password) {
                alert('Please fill in all required fields!');
                return;
            }

            // Unique referral code banana (Jaise naam ka pehla hissa + random numbers)
            const referralCode = name.toLowerCase().replace(/\s+/g, '') + Math.floor(1000 + Math.random() * 9000);
            
            // URL se check karna ke kya user kisi ke referral link se aaya hai?
            const urlParams = new URLSearchParams(window.location.search);
            const referredBy = urlParams.get('ref') || null;

            // Data Supabase Database mein insert karna
            const { data, error } = await supabaseClient
                .from('users')
                .insert([
                    { 
                        name: name, 
                        email: email, 
                        phone: phone, 
                        password: password, 
                        status: 'pending',
                        referral_code: referralCode,
                        referred_by: referredBy
                    }
                ]);

            if (error) {
                alert('Error: ' + error.message);
            } else {
                // Browser ki memory mein user ka naam aur code save kar lena dashboard ke liye
                localStorage.setItem('savedUserName', name);
                localStorage.setItem('userEmail', email);
                localStorage.setItem('userReferralCode', referralCode);

                alert('Sign up successful! Please proceed to deposit.');
                window.location.href = 'deposit.html';
            }
        }
    </script>
</body>
</html>
