<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - PremoMax</title>
    <style>
        body {
            background-color: #f8f9fa;
            font-family: sans-serif;
            margin: 0;
            padding-bottom: 70px; /* Neeche menu ke liye space */
            display: flex;
            justify-content: center;
        }
        .dashboard-container {
            width: 380px;
            padding: 15px;
        }
        /* Top Header */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .user-profile {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .avatar {
            width: 40px;
            height: 40px;
            background-color: #0f172a;
            color: #fbbf24;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
        }
        /* Balance Card */
        .balance-card {
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        .balance-card .title {
            font-size: 12px;
            color: #94a3b8;
            text-transform: uppercase;
        }
        .balance-card .amount {
            font-size: 28px;
            font-weight: bold;
            margin: 5px 0 15px 0;
        }
        .action-buttons {
            display: flex;
            gap: 10px;
        }
        .action-buttons button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        .btn-deposit { background-color: #f59e0b; color: white; }
        .btn-withdraw { background-color: #334155; color: white; }

        /* Section Cards */
        .card {
            background-color: white;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .card-title {
            font-weight: bold;
            color: #0f172a;
            margin-bottom: 10px;
            font-size: 15px;
        }
        /* Task Item */
        .task-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #f1f5f9;
        }
        .task-item:last-child { border-bottom: none; }
        .btn-task {
            background-color: #0f172a;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
        }
        /* Referral Box */
        .ref-box {
            background-color: #f8fafc;
            border: 1px dashed #cbd5e1;
            padding: 10px;
            border-radius: 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            color: #475569;
            margin-top: 10px;
        }
        .btn-copy {
            background-color: #f59e0b;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }
        /* Bottom Navigation Menu */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 380px;
            background-color: white;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
        }
        .nav-item {
            text-align: center;
            font-size: 11px;
            color: #64748b;
            cursor: pointer;
            text-decoration: none;
        }
        .nav-item.active { color: #f59e0b; font-weight: bold; }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="user-profile">
                <div class="avatar">U</div>
                <div>
                    <div style="font-size: 12px; color: #64748b;">Welcome back,</div>
                    <div style="font-weight: bold; color: #0f172a;">User</div>
                </div>
            </div>
            <div style="font-size: 18px; cursor: pointer;">🔔</div>
        </div>

        <!-- Balance Card -->
        <div class="balance-card">
            <div class="title">Total Balance</div>
            <div class="amount">$0.00</div>
            <div class="action-buttons">
                <button class="btn-deposit" onclick="window.location.href='deposit.html'">Deposit</button>
                <button class="btn-withdraw" onclick="alert('Withdrawal section coming soon!')">Withdraw</button>
            </div>
        </div>

        <!-- Daily Tasks Section -->
        <div class="card">
            <div class="card-title">📋 Daily Tasks</div>
            <div class="task-item">
                <div>
                    <div style="font-weight: bold; font-size: 13px;">View Promotional Link</div>
                    <div style="font-size: 11px; color: #64748b;">Reward: $0.025</div>
                </div>
                <button class="btn-task" onclick="completeTask()">Complete</button>
            </div>
            <div class="task-item">
                <div>
                    <div style="font-weight: bold; font-size: 13px;">Visit Partner Website</div>
                    <div style="font-size: 11px; color: #64748b;">Reward: $0.025</div>
                </div>
                <button class="btn-task" onclick="completeTask()">Complete</button>
            </div>
        </div>

        <!-- Referral Section -->
        <div class="card">
            <div class="card-title">🤝 Invite & Earn</div>
            <div style="font-size: 12px; color: #64748b;">Share your referral link with friends and earn bonuses.</div>
            <div class="ref-box">
                <span id="refLink">premomax.com/ref/user123</span>
                <button class="btn-copy" onclick="copyRef()">Copy</button>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation Bar -->
    <div class="bottom-nav">
        <a href="dashboard.html" class="nav-item active">🏠<br>Home</a>
        <a href="#" class="nav-item" onclick="alert('Stats page coming soon!')">📊<br>Stats</a>
        <a href="#" class="nav-item" onclick="alert('Wallet page coming soon!')">💰<br>Wallet</a>
        <a href="#" class="nav-item" onclick="alert('Profile page coming soon!')">👤<br>Profile</a>
        <a href="login.html" class="nav-item" style="color: #ef4444;">🚪<br>Exit</a>
    </div>

    <script>
        function completeTask() {
            alert("Task completed successfully! Reward added.");
        }

        function copyRef() {
            var text = document.getElementById("refLink").innerText;
            navigator.clipboard.writeText(text);
            alert("Referral link copied to clipboard!");
        }
    </script>

</body>
</html>
